# UNUSED since 2026-11-27: every Render service was deleted and nothing builds from this file. Kept as a reference for the Docker install.
# The public demo is the static snapshot on Cloudflare Pages.
# The public demo: an invented company, simulated vendors, no keys. Postgres lives inside the container with the
# 90-day simulation built into the image, so every restart is the same fresh desk in seconds. Sleeps after 15 idle
# minutes on the free plan.
services:
  - type: web
    name: account-desk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEMO
        value: "1"
      # Render's proxies reach the service from its private network; their X-Forwarded-For is trusted.
      - key: FORWARDED_ALLOW_IPS
        value: "10.0.0.0/8"
