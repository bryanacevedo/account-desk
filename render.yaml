# The public demo: an invented company, simulated vendors, no keys. Postgres lives inside the container with the
# 60-day simulation built into the image, so every restart is the same fresh desk in seconds. Sleeps after 15 idle
# minutes on the free plan.
services:
  - type: web
    name: outbound-desk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEMO
        value: "1"
